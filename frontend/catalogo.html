<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produtos — Carvão do Pedro</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/loja.css">
</head>
<body>
  <div id="cabecalho"></div>

  <main class="pagina">
    <div class="container">
      <p class="sobretitulo">Nossa loja</p>
      <h1 class="titulo-pagina">Carvão bom. Churrasco garantido.</h1>
      <p class="subtitulo-pagina">Escolha o tamanho ideal e deixe a brasa com a gente.</p>

      <div class="faixa-info">
        <span id="faixa-entrega"></span>
        <small>Pagamento na entrega ou na retirada</small>
      </div>

      <div class="barra-filtros">
        <div>
          <!-- aria-live: o leitor de tela anuncia quando a contagem muda -->
          <p class="contagem" id="contagem" aria-live="polite"></p>
          <div class="chips" id="filtros" role="group" aria-label="Filtrar por categoria"></div>
        </div>
        <div class="busca campo">
          <label for="busca">Buscar produto</label>
          <div class="busca-campo">
            <input class="input" type="search" id="busca" placeholder="O que vai para a churrasqueira?">
            <span data-icone="busca"></span>
          </div>
        </div>
      </div>

      <div class="grade-produtos" id="lista-produtos"></div>

      <p class="nota">Todos os preços são por pacote. Confira o peso antes de adicionar.</p>
    </div>
  </main>

  <div id="rodape"></div>

  <script src="js/icones.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/loja.js"></script>
  <script src="js/sessao.js"></script>
  <script src="js/carrinho.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/formularios.js"></script>
  <script src="js/paginas/catalogo.js"></script>
</body>
</html>
