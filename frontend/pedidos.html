<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos | Carvão do Pedro</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/painel-pedro.css">
</head>
<body class="pp-body" data-page="pedidos">
<div class="pp-shell">
  <aside class="pp-sidebar" id="pp-sidebar"></aside>
  <div class="pp-main">
    <header class="pp-topbar" id="pp-topbar"></header>
    <main class="pp-page">
      <div class="pp-page-head">
        <div>
          <h1 class="pp-title">Pedidos</h1>
          <p class="pp-subtitle">Confirme, prepare e conclua os pedidos dos clientes.</p>
        </div>
        <div class="pp-period"><span data-icon="calendar"></span>
          <select class="pp-select" id="order-period" aria-label="Período">
            <option value="all">Todos os períodos</option><option value="today">Hoje</option><option value="week">Últimos 7 dias</option><option value="month">Este mês</option>
          </select></div>
      </div>

      <div class="pp-filterbar">
        <div class="pp-tabs" id="order-filters">
          <button class="active" data-status="all">Todos</button><button data-status="pending">Pendente</button><button data-status="preparing">Preparando</button><button data-status="ready">Pronto</button><button data-status="done">Concluído</button><button data-status="cancelled">Cancelado</button>
        </div>
        <span class="pp-countline" id="order-count"></span>
      </div>
      <section class="pp-order-list" id="order-list"></section>
    </main>
    <footer class="pp-footer" id="pp-footer"></footer>
  </div>
</div>
<div class="pp-modal-backdrop" id="cancel-modal" role="dialog" aria-modal="true" aria-labelledby="cancel-title">
  <div class="pp-modal compact">
    <div class="pp-modal-top" style="margin-bottom:0"><h2 id="cancel-title">Cancelar este pedido?</h2><button class="pp-modal-x" type="button" data-close-modal aria-label="Fechar" data-icon="x"></button></div>
    <p>O pedido aparece como cancelado para o cliente. Avise-o pelo WhatsApp, se precisar.</p>
    <div class="pp-modal-item plain"><strong id="cancel-title-id"></strong><br><span id="cancel-sub"></span></div>
    <div class="pp-modal-actions"><button class="pp-btn secondary" type="button" id="keep-order" data-close-modal>Manter pedido</button><button class="pp-btn danger" type="button" id="confirm-cancel-order">Sim, cancelar pedido</button></div>
  </div>
</div>
<div class="pp-modal-backdrop" id="code-modal" role="dialog" aria-modal="true" aria-labelledby="code-title">
  <div class="pp-modal compact">
    <div class="pp-modal-top" style="margin-bottom:0"><h2 id="code-title">Concluir pedido</h2><button class="pp-modal-x" type="button" data-close-modal aria-label="Fechar" data-icon="x"></button></div>
    <p id="code-help">Peça ao cliente o código de 4 números que aparece no site para ele.</p>
    <form id="code-form" novalidate>
      <div class="pp-field"><label for="code-input">Código de entrega</label><input class="pp-input" id="code-input" inputmode="numeric" maxlength="4" autocomplete="off" aria-describedby="code-help code-error"></div>
      <p class="pp-code-error" id="code-error" role="alert"></p>
      <div class="pp-modal-actions"><button class="pp-btn secondary" type="button" data-close-modal>Voltar</button><button class="pp-btn" type="submit">Concluir pedido</button></div>
    </form>
  </div>
</div>
<div class="pp-toast" role="status" aria-live="polite"></div>
<script src="js/painel-pedro.js"></script>
</body>
</html>
